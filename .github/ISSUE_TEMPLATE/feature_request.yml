name: Feature Request
description: Propose a new feature, enhancement, or tool for OstimOne
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to improve student life at OSTİM Technical University? Let us know!

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to an existing limitation or inconvenience?
      placeholder: "I find it difficult to track exam dates because..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or user experience you would like to see.
      placeholder: "Add an exam schedule tab with calendar export integration..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context / Mockups
      description: Add any relevant mockups, diagrams, or links.
    validations:
      required: false
